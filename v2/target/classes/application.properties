# IGDB API
igdb.client.id=${TWITCH_CLIENT_ID}
igdb.client.secret=${TWITCH_CLIENT_SECRET}
igdb.auth.url=https://id.twitch.tv/oauth2/token
igdb.api.url=https://api.igdb.com/v4/games